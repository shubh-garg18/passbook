# passbook — the stack. Three containers: a database, the app, and a proxy
# that gives it a name.
#
# There used to be a fourth. The ledger was a separate application reached over
# HTTP, and it cost a second install, a second login, a token to keep alive,
# and a set of field names defined by somebody else's release cycle.
# DECISIONS.md §36 has the whole reason; the short version is that passbook
# used fifteen of its methods and the one it relied on most — the duplicate
# check — was looking at the wrong thing.
#
# Deliberate choices, all with a reason written down — do not "fix" these back:
#   * postgres, not mariadb                       (D1)
#   * no cron container: automation is `make`     (D7)
#   * ports bound to 127.0.0.1 only               (D9)

name: passbook

services:
  db:
    image: postgres:16-alpine
    container_name: passbook_db
    restart: unless-stopped
    ports:
      # 127.0.0.1 only. Published because the CLI runs on the HOST — `passbook
      # sync`, `verify-ledger` and `upgrade` all read the ledger — while the
      # web container reaches the same database as `db` on the compose network.
      # 5433 rather than 5432 so a Postgres already installed on the host is
      # not in the way.
      - "127.0.0.1:${PASSBOOK_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env — run `make env`}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env — run `make env`}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env — run `make env`}
      TZ: ${TZ:-Asia/Kolkata}
      PGTZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -q so a healthy container does not spam the daemon log every 5s.
      test: ["CMD-SHELL", "pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── the web UI ────────────────────────────────────────────────────────────
  # An additional front end over the same code the CLI runs, not a replacement.
  # Everything still works from the terminal.
  #
  # Built in two stages (Dockerfile): a Node stage compiles the React
  # bundle and is discarded, so the running image has no Node in it. Flask
  # serves that bundle and the JSON API from the same origin — one port, one
  # container, no CORS.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: passbook/web:local
    container_name: passbook_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 127.0.0.1 only. D9. Reaching it from anywhere else changes the
    # reachability story, which is why this ships with a password already.
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # The UI writes uploads into inbox/ and moves files to archive/ on a
      # successful push — the same directories the CLI uses, so the two front
      # ends never diverge.
      - ./inbox:/app/inbox
      - ./archive:/app/archive
      # Writable: the payees page edits these after showing a diff.
      - ./config:/app/config
      # Dumps. `backup.py` runs from here and `pg_dump` is in the image for it;
      # this mount was the missing half, so the Status page said "no database
      # dump in backups/" on every install while the host had a shelf of them.
      # `make check` creates the directory before compose binds it, so it is
      # owned by you rather than by root. §44.
      - ./backups:/app/backups
    environment:
      # Inside the compose network the database is `db` on its own port, so the
      # DSN is assembled here rather than read from `.env` — the values there
      # are the ones the HOST needs, and the two are different by definition.
      PASSBOOK_DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
      PASSBOOK_ACCOUNT_NUMBER: ${PASSBOOK_ACCOUNT_NUMBER:?required for the account assertion}
      PASSBOOK_ASSET_ACCOUNT: ${PASSBOOK_ASSET_ACCOUNT:?which account to write into}
      LARGE_TXN_THRESHOLD: ${LARGE_TXN_THRESHOLD:-10000}
      # Auth lives in config/web-auth.json (already mounted, and writable so
      # the change-password form and TOTP enrolment can write it). Nothing
      # credential-shaped passes through .env or compose. SPEC §15.5, §16.2.
      # Signs the session cookie. Rotating it signs everyone out, which is
      # the desired behaviour and not a data loss.
      PASSBOOK_WEB_SECRET: ${PASSBOOK_WEB_SECRET:?run `make env` or set one}
      # Phase 8 (Tailscale, with a real certificate) sets this to 1 so the
      # session and device cookies carry Secure. Over plain http on 127.0.0.1
      # a Secure cookie would simply never be sent, so it stays off today.
      PASSBOOK_WEB_SECURE_COOKIES: ${PASSBOOK_WEB_SECURE_COOKIES:-0}
      # Read-only listing of the off-site archives. No rclone binary and no
      # credentials are in this container — see §15.3.
      PASSBOOK_RCLONE_REMOTE: ${PASSBOOK_RCLONE_REMOTE:-}
      TZ: ${TZ:-Asia/Kolkata}
    healthcheck:
      # /api/session answers without auth and exercises Flask, the blueprint
      # and the credential file — a better liveness signal than the static
      # bundle, which would return 200 even with the API broken.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/api/session', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Phase 11: clean URLs. SPEC §17.3, D9. ─────────────────────────────────
  # A third listener, and the only one on a privileged port. Still 127.0.0.1
  # only — D9 is about reachability, not port numbers, and nothing here is
  # bound to 0.0.0.0.
  #
  # 8081 keeps working exactly as before: this is an additional way in, not a
  # replacement. The runbook, the DR drill and every healthcheck reference the
  # numbered port and must keep doing so — they run when Caddy may not be up.
  caddy:
    image: caddy:2.8-alpine
    container_name: passbook_caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header", "Host: passbook.localhost", "http://127.0.0.1/api/session"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Named volumes, not bind mounts: a bind mount under /mnt/c breaks Postgres
# file permissions outright. SPEC D8.
volumes:
  pgdata:
  caddydata:
  caddyconfig:
