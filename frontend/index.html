<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Local, single operator, never indexed. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Identity. The mark is the Day Rail: a rubber-stamp frame around a
         24-hour track with the midnight-to-six band shaded. Generated by
         scripts/icons.py so the header glyph and the installed icon cannot
         drift apart. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches --board, so the installed window's title bar continues the
         cover rather than sitting on a strip of browser grey. -->
    <meta name="theme-color" content="#3a4250" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="passbook" />

    <title>passbook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
